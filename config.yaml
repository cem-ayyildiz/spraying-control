name: Spraying Control
version: "0.4.0"
slug: spraying_control
description: >-
  Analyse your knapsack-sprayer walk for coverage, missed strips, overlap, tank
  refills and product use, then publish the results as sensors.
url: https://github.com/cem-ayyildiz/spraying-control
# armv7 is deliberately absent: numpy, scipy and shapely publish no armv7
# wheels, so the image would have to compile them from source on the device.
arch:
  - aarch64
  - amd64
init: false

# Served through the sidebar; no port needs to be exposed on the network.
ingress: true
ingress_port: 8099
panel_icon: mdi:sprinkler-variant
panel_title: Spraying

# Required to read device_tracker history and to write the result sensors.
hassio_api: true
homeassistant_api: true

map:
  - type: share
    read_only: false

options:
  swath_width_m: 1.0
  tank_capacity_l: 18
  base_latitude: 0
  base_longitude: 0
  base_radius_m: 8
  base_min_stop_s: 60
  min_speed_kmh: 0.4
  max_speed_kmh: 4.5
  sensor_prefix: spray
  log_level: info

schema:
  swath_width_m: float(0.1,5)
  tank_capacity_l: float(1,50)
  base_latitude: float(-90,90)
  base_longitude: float(-180,180)
  base_radius_m: float(1,)
  base_min_stop_s: float(10,)
  min_speed_kmh: float(0,)
  max_speed_kmh: float(0.1,)
  sensor_prefix: str
  log_level: list(trace|debug|info|notice|warning|error|fatal)
