# Spraying Control dashboard view
#
# This is a single Lovelace VIEW (a tab), ready to paste. It mirrors the web
# interface: the record controls, a map, and the results. Built-in cards only.
#
# HOW TO ADD IT (safe - adds a tab, touches nothing else):
#   1. Open your dashboard, top-right pencil (Edit dashboard).
#   2. Click the "+" to add a view. In its dialog, top-right 3-dot menu ->
#      "Edit in YAML".
#   3. Select all, delete, and paste EVERYTHING below (from "title:" down).
#   4. Save.
#
# Do NOT paste this into "Raw configuration editor" - that expects a whole
# dashboard and would replace all your tabs. Use "Add view -> Edit in YAML".
#
# Entity IDs assume the device is "Spraying · SM-A356E"
# (device_tracker.sm_a356e). If your tracker differs, replace "sm_a356e"
# throughout and set the map's device_tracker to your phone.

title: Spraying
path: spraying
icon: mdi:sprinkler-variant
cards:
  - type: markdown
    content: >
      ## Record a spray session

      **1.** Stand where you refill and tap **Set start point.**

      **2.** Tap **Recording** on, walk and spray your plot, tap it off.

      **3.** The results below fill in.


      Didn't record? Tap **Analyse today** to use the whole day's track.

  - type: entities
    show_header_toggle: false
    entities:
      - entity: button.spraying_sm_a356e_set_start_point
        name: 1 · Set start point
        icon: mdi:map-marker-plus
      - entity: switch.spraying_sm_a356e_recording
        name: 2 · Recording
      - entity: button.spraying_sm_a356e_analyse_today
        name: Analyse today
      - type: divider
      - entity: sensor.spraying_sm_a356e_start_point
        name: Start point

  - type: markdown
    content: >
      ## Analyse a saved track

      Tap **Upload a track file** to pick a GPX/CSV/KML from your device.

      Or drop a file into **Media** named `spray.gpx` and tap **Analyse file**.
  - type: horizontal-stack
    cards:
      - type: button
        name: Upload a track file…
        icon: mdi:folder-upload
        tap_action:
          action: navigate
          navigation_path: /config/integrations/integration/spraying_control
      - type: button
        name: Analyse /media/spray.gpx
        icon: mdi:file-chart
        tap_action:
          action: perform-action
          perform_action: spraying_control.analyze_file
          data:
            path: /media/spray.gpx

  - type: map
    title: Track & start point
    default_zoom: 18
    entities:
      - device_tracker.sm_a356e
      - sensor.spraying_sm_a356e_start_point

  - type: picture-entity
    entity: image.spraying_sm_a356e_coverage_map
    name: Coverage map
    show_state: false
    show_name: false
  - type: markdown
    content: >
      **Coverage map** — 🟩 sprayed once · 🟨 twice · 🟧 three times · 🟪 four+
      · 🟥 missed. (The pattern of your walk; not a satellite map.)

  - type: grid
    columns: 2
    square: false
    cards:
      - type: gauge
        entity: sensor.spraying_sm_a356e_coverage
        name: Coverage
        unit: "%"
        min: 0
        max: 100
        needle: true
        severity:
          red: 0
          yellow: 70
          green: 90
      - type: gauge
        entity: sensor.spraying_sm_a356e_overlap
        name: Overlap
        unit: "%"
        min: 0
        max: 50
        needle: true
        severity:
          green: 0
          yellow: 15
          red: 30

  - type: glance
    title: Results
    columns: 3
    show_name: true
    show_state: true
    entities:
      - entity: sensor.spraying_sm_a356e_area_sprayed
        name: Sprayed
      - entity: sensor.spraying_sm_a356e_volume_used
        name: Product
      - entity: sensor.spraying_sm_a356e_application_rate
        name: Rate
      - entity: sensor.spraying_sm_a356e_refills
        name: Refills
      - entity: sensor.spraying_sm_a356e_missed_area
        name: Missed
      - entity: sensor.spraying_sm_a356e_distance
        name: Walked

  - type: entities
    title: Details
    show_header_toggle: false
    entities:
      - entity: sensor.spraying_sm_a356e_tank_loads
        name: Tank loads
      - entity: sensor.spraying_sm_a356e_working_time
        name: Time spraying
      - entity: sensor.spraying_sm_a356e_last_run
        name: Last run
