[project]
name = "spraycontrol"
version = "0.9.1"
description = "Analyse sprayer GPS tracks: coverage, overlap, gaps, tank refills and application rate."
readme = "README.md"
authors = [
    { name = "Cem Ayyildiz", email = "cem.ayyildiz@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "shapely>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "scipy>=1.17.1",
]

[project.scripts]
spraycontrol = "spraycontrol.cli:main"

[dependency-groups]
dev = [
    "playwright>=1.62.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The library lives inside the Home Assistant integration so that HACS ships a
# self-contained folder and there is only ever one copy of the analysis code.
packages = ["custom_components/spraying_control/spraycontrol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
