; Home Assistant integration tests. These need the pinned HA test harness,
; which requires a newer Python than the library itself targets, so they live
; in their own environment:
;
;     uv venv --python 3.13 .venv-ha
;     uv pip install --python .venv-ha --prerelease=allow \
;         pytest-homeassistant-custom-component numpy scipy shapely
;     .venv-ha/bin/python -m pytest -c pytest-ha.ini
[pytest]
testpaths = tests_ha
asyncio_mode = auto
addopts = -p no:cacheprovider --log-level=WARNING
log_cli = false
filterwarnings =
    ignore::DeprecationWarning
